<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0907">
<title>Wheel of Fun</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffd84d' stroke='%234dd4d4' stroke-width='4'/><text x='32' y='44' font-size='38' text-anchor='middle' font-family='Arial Black,sans-serif' fill='%231a1410'>%E2%98%85</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffd84d' stroke='%234dd4d4' stroke-width='4'/><text x='32' y='44' font-size='38' text-anchor='middle' font-family='Arial Black,sans-serif' fill='%231a1410'>%E2%98%85</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at top, #2a1f1a 0%, #0d0907 70%) fixed,
      #0d0907;
    color: #f4ead8;
    font-family: 'Impact', 'Anton', 'Bebas Neue', 'Arial Black', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    padding-bottom: 24px;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      #ffd84d 0 36px,
      transparent 36px 72px
    );
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before { top: 0; }
  body::after { bottom: 0; }

  header {
    text-align: center;
    padding: 26px 16px 6px;
    position: relative;
    z-index: 1;
  }
  .title {
    display: inline-block;
    margin: 0;
    font-size: 56px;
    letter-spacing: 5px;
    color: #ff5e7e;
    text-shadow:
      0 0 6px #ff5e7e,
      0 0 14px #ff5e7e,
      0 0 28px rgba(255, 94, 126, 0.55),
      3px 3px 0 #1a0e0a;
    transform: skewX(-6deg);
  }
  .subtitle {
    color: #4dd4d4;
    text-shadow: 0 0 8px #4dd4d4, 0 0 16px rgba(77, 212, 212, 0.5);
    font-size: 14px;
    letter-spacing: 6px;
    margin-top: 6px;
    cursor: pointer;
    display: inline-block;
    padding: 6px 10px;
    transition: color 0.2s, text-shadow 0.2s;
  }
  .subtitle.armed {
    color: #ffd84d;
    text-shadow: 0 0 10px #ffd84d, 0 0 22px #ffd84d, 0 0 36px rgba(255, 216, 77, 0.6);
  }

  main {
    padding: 8px 14px;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .wheel-wrap {
    position: relative;
    width: 92vw;
    max-width: 520px;
    margin: 6px auto 18px;
  }
  .wheel-wrap::after {
    content: '';
    display: block;
    padding-bottom: 100%;
  }
  canvas.wheel {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    margin-left: -20px;
    width: 0; height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 38px solid #ff5e7e;
    filter: drop-shadow(0 0 8px #ff5e7e);
    z-index: 2;
  }

  .controls { text-align: center; }
  .spin-btn {
    background: linear-gradient(180deg, #ff5e7e 0%, #cc3a5e 100%);
    color: #fff;
    border: 3px solid #ffd84d;
    border-radius: 50px;
    padding: 20px 64px;
    font-family: inherit;
    font-size: 34px;
    letter-spacing: 8px;
    cursor: pointer;
    box-shadow:
      0 0 28px rgba(255, 94, 126, 0.6),
      inset 0 -4px 0 rgba(0,0,0,0.3);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .spin-btn:active:not(:disabled) { transform: translateY(2px); }

  .result {
    margin: 18px auto 0;
    max-width: 520px;
    padding: 16px 18px;
    background: rgba(255, 216, 77, 0.07);
    border: 2px dashed #ffd84d;
    border-radius: 8px;
    text-align: center;
    min-height: 72px;
  }
  .result-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: #ffd84d;
    margin-bottom: 6px;
  }
  .result-text {
    font-size: 28px;
    color: #f4ead8;
    letter-spacing: 2px;
    line-height: 1.2;
  }
  .result.golden {
    background: rgba(255, 216, 77, 0.12);
    border-color: #fff5b8;
    box-shadow: 0 0 28px rgba(255, 216, 77, 0.4);
    animation: celebrate-bg 0.6s ease-out;
  }
  .result.golden .result-text {
    color: #ffd84d;
    font-size: 36px;
    text-shadow: 0 0 14px rgba(255, 216, 77, 0.7);
    animation: celebrate 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-block;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.2) rotate(-12deg); opacity: 0; }
    55%  { transform: scale(1.35) rotate(6deg);  opacity: 1; }
    78%  { transform: scale(0.94) rotate(-3deg); }
    100% { transform: scale(1) rotate(0);        opacity: 1; }
  }
  @keyframes celebrate-bg {
    0%   { box-shadow: 0 0 0 rgba(255, 216, 77, 0); }
    50%  { box-shadow: 0 0 60px rgba(255, 216, 77, 0.9); }
    100% { box-shadow: 0 0 28px rgba(255, 216, 77, 0.4); }
  }

  @media (max-width: 600px) {
    .title { font-size: 40px; letter-spacing: 3px; }
    .subtitle { letter-spacing: 4px; font-size: 12px; }
    .spin-btn { font-size: 28px; padding: 16px 48px; letter-spacing: 6px; }
    .result-text { font-size: 24px; }
    .result.golden .result-text { font-size: 30px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="title">WHEEL OF FUN</h1>
  <div class="subtitle" id="subtitle">&#9733; ROAD TRIP EDITION &#9733;</div>
</header>

<main>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas class="wheel" width="600" height="600"></canvas>
  </div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn">SPIN</button>
  </div>

  <div class="result" id="result">
    <div class="result-label">&#9733; YOUR PRIZE &#9733;</div>
    <div class="result-text">Tap SPIN to start</div>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ---------- Fixed slices ----------
  const SLICES = [
    { name: 'Fun Drink',  weight: 3, color: '#4dd4d4', icon: 'drink'  },
    { name: 'Fun Snack',  weight: 3, color: '#ec7547', icon: 'snack'  },
    { name: 'Fun Candy',  weight: 3, color: '#d97acc', icon: 'candy'  },
    { name: 'Movie Time', weight: 3, color: '#a36ad9', icon: 'movie'  },
    { name: 'Ice Cream',  weight: 1, color: null,      icon: 'icecream', golden: true }
  ];

  // ---------- Canvas ----------
  const canvas = document.querySelector('.wheel');
  const ctx = canvas.getContext('2d');
  let rotation = 0;
  let spinning = false;
  let forceGolden = false;
  let spinCount = 0;

  // ---------- Outline icons ----------
  // Each draws centered at (0,0) in a local frame where -y points outward.
  // Strokes use the current ctx.strokeStyle and lineWidth.
  function drawIcon(name) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    switch (name) {
      case 'drink':    return drawDrink();
      case 'snack':    return drawSnack();
      case 'candy':    return drawCandy();
      case 'movie':    return drawMovie();
      case 'icecream': return drawIceCream();
    }
  }

  function drawDrink() {
    // Cup (trapezoid wider at top), lid line, straw
    ctx.beginPath();
    ctx.moveTo(-18, -16);
    ctx.lineTo(18, -16);
    ctx.lineTo(14, 22);
    ctx.lineTo(-14, 22);
    ctx.closePath();
    ctx.stroke();
    // Lid
    ctx.beginPath();
    ctx.moveTo(-20, -16);
    ctx.lineTo(20, -16);
    ctx.stroke();
    // Straw
    ctx.beginPath();
    ctx.moveTo(4, -16);
    ctx.lineTo(12, -32);
    ctx.stroke();
    // Bubbles / label band
    ctx.beginPath();
    ctx.moveTo(-12, 2);
    ctx.lineTo(12, 2);
    ctx.stroke();
  }

  function drawSnack() {
    // Cookie body
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.stroke();
    // Chocolate chips (filled dots)
    const prevFill = ctx.fillStyle;
    ctx.fillStyle = ctx.strokeStyle;
    const chips = [[-8, -6], [6, -3], [-3, 8], [9, 9], [-10, 4]];
    chips.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = prevFill;
  }

  function drawCandy() {
    // Wrapped candy: oval body + twisted ends
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Left twist
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-24, -9);
    ctx.lineTo(-20, 0);
    ctx.lineTo(-24, 9);
    ctx.closePath();
    ctx.stroke();
    // Right twist
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, -9);
    ctx.lineTo(20, 0);
    ctx.lineTo(24, 9);
    ctx.closePath();
    ctx.stroke();
    // Stripe in middle
    ctx.beginPath();
    ctx.moveTo(-9, -6);
    ctx.quadraticCurveTo(0, -2, 9, -6);
    ctx.stroke();
  }

  function drawMovie() {
    // Clapperboard: board (bottom) + slate (top) with diagonal stripes
    // Board
    ctx.beginPath();
    ctx.rect(-22, -4, 44, 24);
    ctx.stroke();
    // Slate
    ctx.beginPath();
    ctx.rect(-22, -18, 44, 10);
    ctx.stroke();
    // Diagonals on slate
    ctx.beginPath();
    ctx.moveTo(-14, -18); ctx.lineTo(-22, -8);
    ctx.moveTo(-2, -18);  ctx.lineTo(-10, -8);
    ctx.moveTo(10, -18);  ctx.lineTo(2, -8);
    ctx.moveTo(22, -18);  ctx.lineTo(14, -8);
    ctx.stroke();
  }

  function drawIceCream() {
    // Cone (triangle pointing down) with crosshatch + scoop on top + cherry
    // Cone outline
    ctx.beginPath();
    ctx.moveTo(-16, -2);
    ctx.lineTo(16, -2);
    ctx.lineTo(0, 26);
    ctx.closePath();
    ctx.stroke();
    // Cone crosshatch
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-16, -2);
    ctx.lineTo(16, -2);
    ctx.lineTo(0, 26);
    ctx.closePath();
    ctx.clip();
    ctx.lineWidth = 2;
    for (let i = -20; i <= 20; i += 6) {
      ctx.beginPath();
      ctx.moveTo(i, -4); ctx.lineTo(i + 14, 28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i, -4); ctx.lineTo(i - 14, 28);
      ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 4;
    // Scoop (semicircle bump)
    ctx.beginPath();
    ctx.arc(0, -2, 16, Math.PI, 0);
    ctx.stroke();
    // Cherry on top
    ctx.beginPath();
    ctx.arc(0, -22, 4.5, 0, Math.PI * 2);
    ctx.stroke();
    // Stem
    ctx.beginPath();
    ctx.moveTo(0, -26);
    ctx.quadraticCurveTo(5, -32, 10, -30);
    ctx.stroke();
  }

  // ---------- Wheel drawing ----------
  function drawWheel() {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) / 2 - 14;

    ctx.clearRect(0, 0, W, H);

    const total = SLICES.reduce((s, a) => s + a.weight, 0);

    // Rotating slices + icons
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    let start = -Math.PI / 2;
    SLICES.forEach((s, i) => {
      const sliceAngle = (s.weight / total) * Math.PI * 2;
      const end = start + sliceAngle;
      const mid = start + sliceAngle / 2;

      // Slice fill
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, start, end);
      ctx.closePath();
      if (s.golden) {
        const grad = ctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
        grad.addColorStop(0, '#fff5b8');
        grad.addColorStop(0.55, '#ffd84d');
        grad.addColorStop(1, '#b8902a');
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = s.color;
      }
      ctx.fill();

      // Slice divider
      ctx.strokeStyle = '#1a1410';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Icon: rotate so its "up" points outward, place at radial distance
      ctx.save();
      ctx.rotate(mid + Math.PI / 2);
      const iconR = sliceAngle < 0.9 ? R * 0.62 : R * 0.58;
      ctx.translate(0, -iconR);
      // Scale narrow slices down a touch so icon fits
      const scale = sliceAngle < 0.7 ? 0.82 : 1.0;
      ctx.scale(scale, scale);
      ctx.strokeStyle = s.golden ? '#5a4515' : '#f4ead8';
      drawIcon(s.icon);
      ctx.restore();

      start = end;
    });

    ctx.restore();

    // Static outer rings (chrome + dashed road line)
    ctx.save();
    ctx.translate(cx, cy);

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#4dd4d4';
    ctx.lineWidth = 8;
    ctx.shadowColor = '#4dd4d4';
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(0, 0, R + 11, 0, Math.PI * 2);
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = '#ffd84d';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.setLineDash([]);

    // Center hub
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    const hubGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
    hubGrad.addColorStop(0, '#ffd84d');
    hubGrad.addColorStop(1, '#b8902a');
    ctx.fillStyle = hubGrad;
    ctx.fill();
    ctx.strokeStyle = '#1a1410';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#1a1410';
    ctx.font = 'bold 40px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 3);

    ctx.restore();
  }

  // ---------- Spin ----------
  function pickIndex() {
    if (forceGolden) {
      const i = SLICES.findIndex(s => s.golden);
      forceGolden = false;
      return i;
    }
    // Golden slices are never picked at random — only via secret trigger.
    const pool = [];
    SLICES.forEach((s, i) => { if (!s.golden) pool.push(i); });
    const total = pool.reduce((sum, i) => sum + SLICES[i].weight, 0);
    let roll = Math.random() * total;
    for (let k = 0; k < pool.length; k++) {
      roll -= SLICES[pool[k]].weight;
      if (roll <= 0) return pool[k];
    }
    return pool[pool.length - 1];
  }

  function cumAngleToSliceMid(targetIdx) {
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    let cum = 0;
    for (let i = 0; i < SLICES.length; i++) {
      const slice = (SLICES[i].weight / total) * Math.PI * 2;
      if (i === targetIdx) return cum + slice / 2;
      cum += slice;
    }
    return 0;
  }

  function currentSliceIndex() {
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    let p = (-rotation) % (Math.PI * 2);
    while (p < 0) p += Math.PI * 2;
    let cum = 0;
    for (let i = 0; i < SLICES.length; i++) {
      const slice = (SLICES[i].weight / total) * Math.PI * 2;
      cum += slice;
      if (p < cum) return i;
    }
    return SLICES.length - 1;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinCount += 1;
    document.getElementById('spinBtn').disabled = true;
    const resultEl = document.getElementById('result');
    resultEl.classList.remove('golden');
    resultEl.querySelector('.result-text').textContent = '…';

    const goldenIdx = SLICES.findIndex(s => s.golden);
    // Slice that arrives at pointer immediately *after* the golden one — its
    // ice-cream-adjacent edge gives the natural "so close!" tease.
    const teaseIdx = (goldenIdx - 1 + SLICES.length) % SLICES.length;

    let targetIdx, teasing = false;
    if (forceGolden) {
      targetIdx = goldenIdx;
      forceGolden = false;
    } else if (spinCount % 2 === 0) {
      // Every other spin is a tease: force the tease slice + edge bias.
      targetIdx = teaseIdx;
      teasing = true;
    } else {
      targetIdx = pickIndex();
    }

    const sliceMid = cumAngleToSliceMid(targetIdx);
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    const sliceAngle = (SLICES[targetIdx].weight / total) * Math.PI * 2;
    const isGolden = !!SLICES[targetIdx].golden;

    let jitter;
    if (teasing) {
      jitter = sliceAngle * 0.45;
    } else {
      jitter = (Math.random() - 0.5) * sliceAngle * 0.7;
    }

    const startRot = rotation;
    const desiredFinal = -(sliceMid + jitter);
    const baseTurns = teasing ? 7 : 6;
    const turns = baseTurns + Math.floor(Math.random() * 3);
    let targetRot = desiredFinal;
    while (targetRot - startRot < turns * Math.PI * 2) {
      targetRot += Math.PI * 2;
    }

    const duration = teasing ? 8500 : 6500;
    const t0 = performance.now();
    let lastIdx = currentSliceIndex();

    function ease(t) { return 1 - Math.pow(1 - t, 3); }

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = startRot + (targetRot - startRot) * ease(t);
      drawWheel();
      const cur = currentSliceIndex();
      if (cur !== lastIdx) { tick(); lastIdx = cur; }
      if (t < 1) requestAnimationFrame(frame);
      else { rotation = targetRot; drawWheel(); finishSpin(targetIdx); }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(idx) {
    const s = SLICES[idx];
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    const resultEl = document.getElementById('result');
    if (s.golden) {
      resultEl.classList.add('golden');
      resultEl.querySelector('.result-text').textContent = '★ ICE CREAM! ★';
      launchConfetti();
      celebrateSound();
    } else {
      resultEl.classList.remove('golden');
      resultEl.querySelector('.result-text').textContent = s.name;
    }
  }

  // ---------- Tick sound ----------
  let audioCtx = null;
  function tick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 1500;
      o.type = 'square';
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.05, now + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
      o.connect(g).connect(audioCtx.destination);
      o.start(now);
      o.stop(now + 0.06);
    } catch (e) { /* ignore */ }
  }

  // ---------- Celebration sound (ice cream win) ----------
  function celebrateSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        const start = now + i * 0.09;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.18, start + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, start + 0.45);
        o.connect(g).connect(audioCtx.destination);
        o.start(start);
        o.stop(start + 0.5);
      });
    } catch (e) { /* ignore */ }
  }

  // ---------- Confetti ----------
  const confettiCanvas = document.createElement('canvas');
  confettiCanvas.style.cssText =
    'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100';
  document.body.appendChild(confettiCanvas);
  const cctx = confettiCanvas.getContext('2d');
  function sizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  sizeConfetti();
  window.addEventListener('resize', sizeConfetti);

  let confettiParticles = [];
  let confettiAnimating = false;
  const CONFETTI_COLORS = [
    '#ff5e7e', '#ffd84d', '#4dd4d4', '#7ab87a',
    '#d97acc', '#ec7547', '#a36ad9', '#fff5b8'
  ];

  function launchConfetti() {
    const wheelEl = document.querySelector('.wheel');
    const r = wheelEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const N = 200;
    for (let i = 0; i < N; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 11;
      confettiParticles.push({
        x: cx + (Math.random() - 0.5) * 30,
        y: cy + (Math.random() - 0.5) * 30,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 6,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.35,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 10,
        alpha: 1,
        life: 0
      });
    }
    if (!confettiAnimating) {
      confettiAnimating = true;
      requestAnimationFrame(stepConfetti);
    }
  }

  function stepConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      p.vy += 0.28;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;
      p.life += 1;
      if (p.life > 90) p.alpha -= 0.018;
      if (p.alpha <= 0.04 || p.y > confettiCanvas.height + 60) {
        confettiParticles.splice(i, 1);
        continue;
      }
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, p.alpha);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    }
    if (confettiParticles.length > 0) {
      requestAnimationFrame(stepConfetti);
    } else {
      confettiAnimating = false;
    }
  }

  // ---------- Secret trigger: triple-tap the subtitle ----------
  const subtitle = document.getElementById('subtitle');
  let tapCount = 0;
  let tapTimer = null;
  function onSecretTap() {
    tapCount += 1;
    clearTimeout(tapTimer);
    if (tapCount >= 3) {
      tapCount = 0;
      forceGolden = true;
      subtitle.classList.add('armed');
      setTimeout(() => subtitle.classList.remove('armed'), 150);
    } else {
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    }
  }
  subtitle.addEventListener('click', onSecretTap);

  // ---------- Init ----------
  document.getElementById('spinBtn').addEventListener('click', spin);
  drawWheel();
})();
</script>
</body>
</html>
