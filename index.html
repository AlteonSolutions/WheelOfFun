<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0907">
<title>Wheel of Fun</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffd84d' stroke='%234dd4d4' stroke-width='4'/><text x='32' y='44' font-size='38' text-anchor='middle' font-family='Arial Black,sans-serif' fill='%231a1410'>%E2%98%85</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffd84d' stroke='%234dd4d4' stroke-width='4'/><text x='32' y='44' font-size='38' text-anchor='middle' font-family='Arial Black,sans-serif' fill='%231a1410'>%E2%98%85</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at top, #2a1f1a 0%, #0d0907 70%) fixed,
      #0d0907;
    color: #f4ead8;
    font-family: 'Impact', 'Anton', 'Bebas Neue', 'Arial Black', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    padding-bottom: 24px;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      #ffd84d 0 36px,
      transparent 36px 72px
    );
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before { top: 0; }
  body::after { bottom: 0; }

  header {
    text-align: center;
    padding: 26px 16px 6px;
    position: relative;
    z-index: 1;
  }
  .title {
    display: inline-block;
    margin: 0;
    font-size: 56px;
    letter-spacing: 5px;
    color: #ff5e7e;
    text-shadow:
      0 0 6px #ff5e7e,
      0 0 14px #ff5e7e,
      0 0 28px rgba(255, 94, 126, 0.55),
      3px 3px 0 #1a0e0a;
    transform: skewX(-6deg);
  }
  .subtitle {
    color: #4dd4d4;
    text-shadow: 0 0 8px #4dd4d4, 0 0 16px rgba(77, 212, 212, 0.5);
    font-size: 14px;
    letter-spacing: 6px;
    margin-top: 6px;
    cursor: pointer;
    display: inline-block;
    padding: 6px 10px;
    transition: color 0.2s, text-shadow 0.2s;
  }
  .subtitle.armed {
    color: #ffd84d;
    text-shadow: 0 0 10px #ffd84d, 0 0 22px #ffd84d, 0 0 36px rgba(255, 216, 77, 0.6);
  }

  main {
    padding: 8px 14px;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .wheel-wrap {
    position: relative;
    width: 92vw;
    max-width: 520px;
    margin: 6px auto 18px;
  }
  .wheel-wrap::after {
    content: '';
    display: block;
    padding-bottom: 100%;
  }
  canvas.wheel {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    margin-left: -20px;
    width: 0; height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 38px solid #ff5e7e;
    filter: drop-shadow(0 0 8px #ff5e7e);
    z-index: 2;
  }

  .controls { text-align: center; }
  .spin-btn {
    background: linear-gradient(180deg, #ff5e7e 0%, #cc3a5e 100%);
    color: #fff;
    border: 3px solid #ffd84d;
    border-radius: 50px;
    padding: 20px 64px;
    font-family: inherit;
    font-size: 34px;
    letter-spacing: 8px;
    cursor: pointer;
    box-shadow:
      0 0 28px rgba(255, 94, 126, 0.6),
      inset 0 -4px 0 rgba(0,0,0,0.3);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .spin-btn:active:not(:disabled) { transform: translateY(2px); }

  .result {
    margin: 18px auto 0;
    max-width: 520px;
    padding: 16px 18px;
    background: rgba(255, 216, 77, 0.07);
    border: 2px dashed #ffd84d;
    border-radius: 8px;
    text-align: center;
    min-height: 72px;
  }
  .result-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: #ffd84d;
    margin-bottom: 6px;
  }
  .result-text {
    font-size: 28px;
    color: #f4ead8;
    letter-spacing: 2px;
    line-height: 1.2;
  }
  .result.golden {
    background: rgba(255, 216, 77, 0.12);
    border-color: #fff5b8;
    box-shadow: 0 0 28px rgba(255, 216, 77, 0.4);
    animation: celebrate-bg 0.6s ease-out;
  }
  .result.golden .result-text {
    color: #ffd84d;
    font-size: 36px;
    text-shadow: 0 0 14px rgba(255, 216, 77, 0.7);
    animation: celebrate 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-block;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.15) rotate(-18deg); opacity: 0; }
    45%  { transform: scale(1.6)  rotate(10deg);  opacity: 1; }
    65%  { transform: scale(0.88) rotate(-5deg); }
    82%  { transform: scale(1.12) rotate(3deg); }
    100% { transform: scale(1)    rotate(0);      opacity: 1; }
  }
  @keyframes celebrate-bg {
    0%   { box-shadow: 0 0 0 rgba(255, 216, 77, 0); }
    50%  { box-shadow: 0 0 60px rgba(255, 216, 77, 0.9); }
    100% { box-shadow: 0 0 28px rgba(255, 216, 77, 0.4); }
  }

  @media (max-width: 600px) {
    .title { font-size: 40px; letter-spacing: 3px; }
    .subtitle { letter-spacing: 4px; font-size: 12px; }
    .spin-btn { font-size: 28px; padding: 16px 48px; letter-spacing: 6px; }
    .result-text { font-size: 24px; }
    .result.golden .result-text { font-size: 30px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="title">WHEEL OF FUN</h1>
  <div class="subtitle" id="subtitle">&#9733; ROAD TRIP EDITION &#9733;</div>
</header>

<main>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas class="wheel" width="600" height="600"></canvas>
  </div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn">SPIN</button>
  </div>

  <div class="result" id="result">
    <div class="result-label">&#9733; YOUR PRIZE &#9733;</div>
    <div class="result-text">Tap SPIN to start</div>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ---------- Fixed slices (Carnival palette) ----------
  const SLICES = [
    { name: 'Fun Drink',  weight: 3, color: '#d94f4f', icon: 'drink'  }, // red
    { name: 'Fun Snack',  weight: 3, color: '#f4ead8', icon: 'snack'  }, // cream
    { name: 'Fun Candy',  weight: 3, color: '#5b9bd5', icon: 'candy'  }, // blue
    { name: 'Movie Time', weight: 3, color: '#ffd84d', icon: 'movie'  }, // yellow
    { name: 'Ice Cream',  weight: 1, color: null,      icon: 'icecream', golden: true }
  ];

  // Lightbulb chase: full marquee swap every this many ms
  const BULB_CYCLE_MS = 250;

  // ---------- Canvas ----------
  const canvas = document.querySelector('.wheel');
  const ctx = canvas.getContext('2d');
  let rotation = 0;
  let spinning = false;
  let forceGolden = false;
  let spinCount = 0;

  // ---------- Outline icons ----------
  // Each draws centered at (0,0) in a local frame where -y points outward.
  // Strokes use the current ctx.strokeStyle and lineWidth.
  function drawIcon(name) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    switch (name) {
      case 'drink':    return drawDrink();
      case 'snack':    return drawSnack();
      case 'candy':    return drawCandy();
      case 'movie':    return drawMovie();
      case 'icecream': return drawIceCream();
    }
  }

  function drawDrink() {
    // Cup (trapezoid wider at top), lid line, straw
    ctx.beginPath();
    ctx.moveTo(-18, -16);
    ctx.lineTo(18, -16);
    ctx.lineTo(14, 22);
    ctx.lineTo(-14, 22);
    ctx.closePath();
    ctx.stroke();
    // Lid
    ctx.beginPath();
    ctx.moveTo(-20, -16);
    ctx.lineTo(20, -16);
    ctx.stroke();
    // Straw
    ctx.beginPath();
    ctx.moveTo(4, -16);
    ctx.lineTo(12, -32);
    ctx.stroke();
    // Bubbles / label band
    ctx.beginPath();
    ctx.moveTo(-12, 2);
    ctx.lineTo(12, 2);
    ctx.stroke();
  }

  function drawSnack() {
    // Cookie body
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.stroke();
    // Chocolate chips (filled dots)
    const prevFill = ctx.fillStyle;
    ctx.fillStyle = ctx.strokeStyle;
    const chips = [[-8, -6], [6, -3], [-3, 8], [9, 9], [-10, 4]];
    chips.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = prevFill;
  }

  function drawCandy() {
    // Wrapped candy: oval body + twisted ends
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Left twist
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-24, -9);
    ctx.lineTo(-20, 0);
    ctx.lineTo(-24, 9);
    ctx.closePath();
    ctx.stroke();
    // Right twist
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, -9);
    ctx.lineTo(20, 0);
    ctx.lineTo(24, 9);
    ctx.closePath();
    ctx.stroke();
    // Stripe in middle
    ctx.beginPath();
    ctx.moveTo(-9, -6);
    ctx.quadraticCurveTo(0, -2, 9, -6);
    ctx.stroke();
  }

  function drawMovie() {
    // Clapperboard: board (bottom) + slate (top) with diagonal stripes
    // Board
    ctx.beginPath();
    ctx.rect(-22, -4, 44, 24);
    ctx.stroke();
    // Slate
    ctx.beginPath();
    ctx.rect(-22, -18, 44, 10);
    ctx.stroke();
    // Diagonals on slate
    ctx.beginPath();
    ctx.moveTo(-14, -18); ctx.lineTo(-22, -8);
    ctx.moveTo(-2, -18);  ctx.lineTo(-10, -8);
    ctx.moveTo(10, -18);  ctx.lineTo(2, -8);
    ctx.moveTo(22, -18);  ctx.lineTo(14, -8);
    ctx.stroke();
  }

  function drawIceCream() {
    // Cone (triangle pointing down) with crosshatch + scoop on top + cherry
    // Cone outline
    ctx.beginPath();
    ctx.moveTo(-16, -2);
    ctx.lineTo(16, -2);
    ctx.lineTo(0, 26);
    ctx.closePath();
    ctx.stroke();
    // Cone crosshatch
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-16, -2);
    ctx.lineTo(16, -2);
    ctx.lineTo(0, 26);
    ctx.closePath();
    ctx.clip();
    ctx.lineWidth = 2;
    for (let i = -20; i <= 20; i += 6) {
      ctx.beginPath();
      ctx.moveTo(i, -4); ctx.lineTo(i + 14, 28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i, -4); ctx.lineTo(i - 14, 28);
      ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 4;
    // Scoop (semicircle bump)
    ctx.beginPath();
    ctx.arc(0, -2, 16, Math.PI, 0);
    ctx.stroke();
    // Cherry on top
    ctx.beginPath();
    ctx.arc(0, -22, 4.5, 0, Math.PI * 2);
    ctx.stroke();
    // Stem
    ctx.beginPath();
    ctx.moveTo(0, -26);
    ctx.quadraticCurveTo(5, -32, 10, -30);
    ctx.stroke();
  }

  // ---------- Wheel drawing ----------
  function drawWheel() {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) / 2 - 14;

    ctx.clearRect(0, 0, W, H);

    const total = SLICES.reduce((s, a) => s + a.weight, 0);

    // Rotating slices + icons
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    let start = -Math.PI / 2;
    SLICES.forEach((s, i) => {
      const sliceAngle = (s.weight / total) * Math.PI * 2;
      const end = start + sliceAngle;
      const mid = start + sliceAngle / 2;

      // Slice fill
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, start, end);
      ctx.closePath();
      if (s.golden) {
        const grad = ctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
        grad.addColorStop(0, '#fff5b8');
        grad.addColorStop(0.55, '#ffd84d');
        grad.addColorStop(1, '#b8902a');
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = s.color;
      }
      ctx.fill();

      // Slice divider
      ctx.strokeStyle = '#1a1410';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Icon: rotate so its "up" points outward, place at radial distance
      ctx.save();
      ctx.rotate(mid + Math.PI / 2);
      const iconR = sliceAngle < 0.9 ? R * 0.62 : R * 0.55;
      ctx.translate(0, -iconR);
      // Slightly smaller on the narrow ice-cream slice so it still fits
      const scale = sliceAngle < 0.7 ? 1.15 : 1.5;
      ctx.scale(scale, scale);
      ctx.strokeStyle = s.golden ? '#5a4515' : '#1a1410';
      drawIcon(s.icon);
      ctx.restore();

      start = end;
    });

    ctx.restore();

    // Carnival rim + animated chase lightbulbs (static; do not rotate with wheel)
    ctx.save();
    ctx.translate(cx, cy);

    // Inner gold rim
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#c9a23a';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Animated marquee bulbs: alternating lit/dim, pattern swaps each cycle
    const BULB_N = 24;
    const BULB_R_CENTER = R + 18;
    const BULB_R_SIZE = 9;
    const step = Math.floor(performance.now() / BULB_CYCLE_MS);
    for (let i = 0; i < BULB_N; i++) {
      const ang = (i / BULB_N) * Math.PI * 2;
      const bx = Math.cos(ang) * BULB_R_CENTER;
      const by = Math.sin(ang) * BULB_R_CENTER;
      const lit = ((i + step) % 2) === 0;
      if (lit) {
        // Glowing lit bulb
        ctx.beginPath();
        ctx.arc(bx, by, BULB_R_SIZE, 0, Math.PI * 2);
        ctx.fillStyle = '#fff5d6';
        ctx.shadowColor = '#ffd84d';
        ctx.shadowBlur = 22;
        ctx.fill();
        ctx.shadowBlur = 0;
        // Bright hot core
        ctx.beginPath();
        ctx.arc(bx, by, BULB_R_SIZE * 0.42, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      } else {
        // Dim unlit bulb
        ctx.beginPath();
        ctx.arc(bx, by, BULB_R_SIZE, 0, Math.PI * 2);
        ctx.fillStyle = '#3a2810';
        ctx.fill();
        ctx.strokeStyle = '#1a1410';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // Center hub: red dome with gold star
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    const hubGrad = ctx.createRadialGradient(-12, -12, 6, 0, 0, 44);
    hubGrad.addColorStop(0, '#ff7a7a');
    hubGrad.addColorStop(1, '#a01818');
    ctx.fillStyle = hubGrad;
    ctx.fill();
    ctx.strokeStyle = '#c9a23a';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ffd84d';
    ctx.font = 'bold 40px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 3);

    ctx.restore();
  }

  // ---------- Spin ----------
  function pickIndex() {
    if (forceGolden) {
      const i = SLICES.findIndex(s => s.golden);
      forceGolden = false;
      return i;
    }
    // Golden slices are never picked at random — only via secret trigger.
    const pool = [];
    SLICES.forEach((s, i) => { if (!s.golden) pool.push(i); });
    const total = pool.reduce((sum, i) => sum + SLICES[i].weight, 0);
    let roll = Math.random() * total;
    for (let k = 0; k < pool.length; k++) {
      roll -= SLICES[pool[k]].weight;
      if (roll <= 0) return pool[k];
    }
    return pool[pool.length - 1];
  }

  function cumAngleToSliceMid(targetIdx) {
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    let cum = 0;
    for (let i = 0; i < SLICES.length; i++) {
      const slice = (SLICES[i].weight / total) * Math.PI * 2;
      if (i === targetIdx) return cum + slice / 2;
      cum += slice;
    }
    return 0;
  }

  function currentSliceIndex() {
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    let p = (-rotation) % (Math.PI * 2);
    while (p < 0) p += Math.PI * 2;
    let cum = 0;
    for (let i = 0; i < SLICES.length; i++) {
      const slice = (SLICES[i].weight / total) * Math.PI * 2;
      cum += slice;
      if (p < cum) return i;
    }
    return SLICES.length - 1;
  }

  function spin() {
    if (spinning) return;
    unlockAudio();
    spinning = true;
    spinCount += 1;
    document.getElementById('spinBtn').disabled = true;
    const resultEl = document.getElementById('result');
    resultEl.classList.remove('golden');
    resultEl.querySelector('.result-text').textContent = '…';

    const goldenIdx = SLICES.findIndex(s => s.golden);
    // Slice that arrives at pointer immediately *after* the golden one — its
    // ice-cream-adjacent edge gives the natural "so close!" tease.
    const teaseIdx = (goldenIdx - 1 + SLICES.length) % SLICES.length;

    let targetIdx, teasing = false;
    if (forceGolden) {
      targetIdx = goldenIdx;
      forceGolden = false;
    } else if (spinCount % 2 === 0) {
      // Every other spin is a tease: force the tease slice + edge bias.
      targetIdx = teaseIdx;
      teasing = true;
    } else {
      targetIdx = pickIndex();
    }

    const sliceMid = cumAngleToSliceMid(targetIdx);
    const total = SLICES.reduce((s, a) => s + a.weight, 0);
    const sliceAngle = (SLICES[targetIdx].weight / total) * Math.PI * 2;
    const isGolden = !!SLICES[targetIdx].golden;

    let jitter;
    if (teasing) {
      jitter = sliceAngle * 0.45;
    } else {
      jitter = (Math.random() - 0.5) * sliceAngle * 0.7;
    }

    const startRot = rotation;
    const desiredFinal = -(sliceMid + jitter);
    const baseTurns = teasing ? 7 : 6;
    const turns = baseTurns + Math.floor(Math.random() * 3);
    let targetRot = desiredFinal;
    while (targetRot - startRot < turns * Math.PI * 2) {
      targetRot += Math.PI * 2;
    }

    const duration = teasing ? 8500 : 6500;
    const t0 = performance.now();
    let lastIdx = currentSliceIndex();

    function ease(t) { return 1 - Math.pow(1 - t, 3); }

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = startRot + (targetRot - startRot) * ease(t);
      drawWheel();
      const cur = currentSliceIndex();
      if (cur !== lastIdx) { tick(); lastIdx = cur; }
      if (t < 1) requestAnimationFrame(frame);
      else { rotation = targetRot; drawWheel(); finishSpin(targetIdx); }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(idx) {
    const s = SLICES[idx];
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    const resultEl = document.getElementById('result');
    if (s.golden) {
      resultEl.classList.add('golden');
      resultEl.querySelector('.result-text').textContent = '★ ICE CREAM! ★';
      launchConfetti();
      celebrateSound();
      setTimeout(launchIceCreamCascade, 250);
      setTimeout(launchConfetti, 1200);
    } else {
      resultEl.classList.remove('golden');
      resultEl.querySelector('.result-text').textContent = s.name;
    }
  }

  // ---------- Tick sound ----------
  let audioCtx = null;
  function tick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 1500;
      o.type = 'square';
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.05, now + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
      o.connect(g).connect(audioCtx.destination);
      o.start(now);
      o.stop(now + 0.06);
    } catch (e) { /* ignore */ }
  }

  // ---------- Celebration sound (ice cream win) ----------

  const ICECREAM_FLAVORS = [
    { scoop: '#ffb3c1', cone: '#c97c5d' }, // strawberry
    { scoop: '#a8e6cf', cone: '#c97c5d' }, // mint
    { scoop: '#8b5a2b', cone: '#c97c5d' }, // chocolate
    { scoop: '#fff5d6', cone: '#c97c5d' }, // vanilla
    { scoop: '#d4a5e8', cone: '#c97c5d' }, // grape
    { scoop: '#ff9b59', cone: '#c97c5d' }  // orange sherbet
  ];
  const POPSICLE_COLORS = [
    '#ff5e7e', '#ff9b59', '#5b9bd5', '#7ab87a', '#d4a5e8', '#ffd84d'
  ];
  // Weighted treat-type pool (cone has the highest share since it's the prize)
  const TREAT_POOL = [
    'cone', 'cone', 'cone', 'cone',
    'sundae', 'sundae', 'sundae',
    'milkshake', 'milkshake',
    'popsicle', 'popsicle'
  ];

  function launchIceCreamCascade() {
    const w = confettiCanvas.width;
    const N = 55;
    for (let i = 0; i < N; i++) {
      setTimeout(() => {
        const type = TREAT_POOL[Math.floor(Math.random() * TREAT_POOL.length)];
        const f1 = ICECREAM_FLAVORS[Math.floor(Math.random() * ICECREAM_FLAVORS.length)];
        const f2 = ICECREAM_FLAVORS[Math.floor(Math.random() * ICECREAM_FLAVORS.length)];
        treatParticles.push({
          type: type,
          x: Math.random() * w,
          y: -90 - Math.random() * 60,
          vx: (Math.random() - 0.5) * 1.6,
          vy: 0.4 + Math.random() * 1.2,
          rot: (Math.random() - 0.5) * 0.4,
          vRot: (Math.random() - 0.5) * 0.04,
          wob: Math.random() * Math.PI * 2,
          wobSpeed: 0.025 + Math.random() * 0.03,
          size: 1.35 + Math.random() * 1.05,
          scoopColor: f1.scoop,
          scoop2Color: f2.scoop,
          coneColor: f1.cone,
          popColor: POPSICLE_COLORS[Math.floor(Math.random() * POPSICLE_COLORS.length)]
        });
        if (!confettiAnimating) {
          confettiAnimating = true;
          requestAnimationFrame(stepConfetti);
        }
      }, i * 65);
    }
  }

  function drawTreatParticle(p) {
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.scale(p.size, p.size);
    cctx.strokeStyle = '#1a1410';
    cctx.lineWidth = 2;
    cctx.lineJoin = 'round';
    cctx.lineCap = 'round';
    switch (p.type) {
      case 'cone':      drawConeShape(p);      break;
      case 'milkshake': drawMilkshakeShape(p); break;
      case 'sundae':    drawSundaeShape(p);    break;
      case 'popsicle':  drawPopsicleShape(p);  break;
    }
    cctx.restore();
  }

  function drawConeShape(p) {
    // Cone
    cctx.fillStyle = p.coneColor;
    cctx.beginPath();
    cctx.moveTo(-14, -2);
    cctx.lineTo(14, -2);
    cctx.lineTo(0, 22);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Crosshatch
    cctx.save();
    cctx.beginPath();
    cctx.moveTo(-14, -2); cctx.lineTo(14, -2); cctx.lineTo(0, 22); cctx.closePath();
    cctx.clip();
    cctx.strokeStyle = 'rgba(26,20,16,0.35)';
    cctx.lineWidth = 1;
    for (let i = -16; i <= 16; i += 5) {
      cctx.beginPath();
      cctx.moveTo(i, -2); cctx.lineTo(i + 10, 22); cctx.stroke();
      cctx.beginPath();
      cctx.moveTo(i, -2); cctx.lineTo(i - 10, 22); cctx.stroke();
    }
    cctx.restore();
    // Scoop
    cctx.strokeStyle = '#1a1410';
    cctx.lineWidth = 2;
    cctx.fillStyle = p.scoopColor;
    cctx.beginPath();
    cctx.arc(0, -2, 14, Math.PI, 0);
    cctx.lineTo(14, -2);
    cctx.lineTo(-14, -2);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Cherry
    cctx.fillStyle = '#d94f4f';
    cctx.beginPath();
    cctx.arc(0, -18, 3.5, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
  }

  function drawMilkshakeShape(p) {
    // Glass with curved sides
    cctx.fillStyle = p.scoopColor;
    cctx.beginPath();
    cctx.moveTo(-15, -10);
    cctx.bezierCurveTo(-13, 4, -11, 12, -9, 22);
    cctx.lineTo(9, 22);
    cctx.bezierCurveTo(11, 12, 13, 4, 15, -10);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Glass rim line
    cctx.beginPath();
    cctx.moveTo(-15, -10);
    cctx.lineTo(15, -10);
    cctx.stroke();
    // Whipped cream dome
    cctx.fillStyle = '#fff5e8';
    cctx.beginPath();
    cctx.moveTo(-14, -10);
    cctx.quadraticCurveTo(-11, -22, -5, -16);
    cctx.quadraticCurveTo(-1, -24, 4, -16);
    cctx.quadraticCurveTo(10, -22, 14, -10);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Straw
    cctx.save();
    cctx.strokeStyle = '#ec7547';
    cctx.lineWidth = 3;
    cctx.beginPath();
    cctx.moveTo(5, -12);
    cctx.lineTo(13, -28);
    cctx.stroke();
    cctx.restore();
    // Cherry on top
    cctx.fillStyle = '#d94f4f';
    cctx.beginPath();
    cctx.arc(-3, -20, 3.5, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
  }

  function drawSundaeShape(p) {
    // Bowl (lower half-ellipse)
    cctx.fillStyle = '#e8d4a8';
    cctx.beginPath();
    cctx.moveTo(-22, 8);
    cctx.lineTo(22, 8);
    cctx.bezierCurveTo(22, 22, 14, 26, 0, 26);
    cctx.bezierCurveTo(-14, 26, -22, 22, -22, 8);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Bowl rim ellipse top
    cctx.fillStyle = '#d4bc8c';
    cctx.beginPath();
    cctx.ellipse(0, 8, 22, 4, 0, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
    // Scoop 1 (left, behind)
    cctx.fillStyle = p.scoop2Color;
    cctx.beginPath();
    cctx.arc(-8, 2, 10, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
    // Scoop 2 (right, front)
    cctx.fillStyle = p.scoopColor;
    cctx.beginPath();
    cctx.arc(7, -2, 11, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
    // Cherry on top
    cctx.fillStyle = '#d94f4f';
    cctx.beginPath();
    cctx.arc(2, -14, 3.5, 0, Math.PI * 2);
    cctx.fill();
    cctx.stroke();
    // Cherry stem
    cctx.strokeStyle = '#69b369';
    cctx.lineWidth = 1.5;
    cctx.beginPath();
    cctx.moveTo(2, -17);
    cctx.quadraticCurveTo(6, -22, 8, -19);
    cctx.stroke();
  }

  function drawPopsicleShape(p) {
    // Pop body: rounded-top rectangle
    cctx.fillStyle = p.popColor;
    cctx.beginPath();
    cctx.moveTo(-11, 4);
    cctx.lineTo(-11, -16);
    cctx.quadraticCurveTo(-11, -26, 0, -26);
    cctx.quadraticCurveTo(11, -26, 11, -16);
    cctx.lineTo(11, 4);
    cctx.closePath();
    cctx.fill();
    cctx.stroke();
    // Highlight stripe
    cctx.save();
    cctx.strokeStyle = 'rgba(255,255,255,0.45)';
    cctx.lineWidth = 2.5;
    cctx.beginPath();
    cctx.moveTo(-6, -18);
    cctx.lineTo(-6, -4);
    cctx.stroke();
    cctx.restore();
    // Stick
    cctx.fillStyle = '#d2a96b';
    cctx.beginPath();
    cctx.rect(-3, 4, 6, 22);
    cctx.fill();
    cctx.stroke();
  }

  function launchConfetti() {
    const wheelEl = document.querySelector('.wheel');
    const r = wheelEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const N = 200;
    for (let i = 0; i < N; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 11;
      confettiParticles.push({
        x: cx + (Math.random() - 0.5) * 30,
        y: cy + (Math.random() - 0.5) * 30,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 6,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.35,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 10,
        alpha: 1,
        life: 0
      });
    }
    if (!confettiAnimating) {
      confettiAnimating = true;
      requestAnimationFrame(stepConfetti);
    }
  }

  function stepConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      p.vy += 0.28;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;
      p.life += 1;
      if (p.life > 90) p.alpha -= 0.018;
      if (p.alpha <= 0.04 || p.y > confettiCanvas.height + 60) {
        confettiParticles.splice(i, 1);
        continue;
      }
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, p.alpha);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    }
    for (let i = treatParticles.length - 1; i >= 0; i--) {
      const p = treatParticles[i];
      p.vy += 0.09;
      p.wob += p.wobSpeed;
      p.x += p.vx + Math.sin(p.wob) * 0.5;
      p.y += p.vy;
      p.rot += p.vRot;
      p.life += 1;
      if (p.y > confettiCanvas.height + 120) {
        treatParticles.splice(i, 1);
        continue;
      }
      drawTreatParticle(p);
    }
    if (confettiParticles.length > 0 || treatParticles.length > 0) {
      requestAnimationFrame(stepConfetti);
    } else {
      confettiAnimating = false;
    }
  }

  // ---------- Secret trigger: triple-tap the subtitle ----------
  const subtitle = document.getElementById('subtitle');
  let tapCount = 0;
  let tapTimer = null;
  function onSecretTap() {
    tapCount += 1;
    clearTimeout(tapTimer);
    if (tapCount >= 3) {
      tapCount = 0;
      forceGolden = true;
      subtitle.classList.add('armed');
      setTimeout(() => subtitle.classList.remove('armed'), 150);
    } else {
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    }
  }
  subtitle.addEventListener('click', onSecretTap);

  // ---------- Init ----------
  document.getElementById('spinBtn').addEventListener('click', spin);
  drawWheel();
  // Drive the marquee bulb chase: redraw the wheel every cycle so the
  // alternating pattern flips. During a spin the spin's own rAF redraws
  // at 60fps and this interval is harmless overlap.
  setInterval(() => { if (!spinning) drawWheel(); }, BULB_CYCLE_MS);
})();
</script>
</body>
</html>
