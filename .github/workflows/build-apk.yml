name: Build APK

# Push → about three minutes later the APK exists in two places:
#   1. Committed at dist/WheelOfFun-debug.apk (git pull on the phone, tap file, install).
#   2. Attached to a rolling `latest` GitHub Release (GH mobile app downloads it directly).
# Both exist because they fail in different places. The release is the one that usually gets used.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'dist/**'      # APK-only pushes must not re-trigger this workflow
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write      # commit-back and release creation both need write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the detached commit) so the push at
          # the end has somewhere to land.
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync index.html into Android assets
        # Keep the APK's bundled HTML in lockstep with the repo root.
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Generate Gradle wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Commit APK to the branch
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/WheelOfFun-debug.apk

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/WheelOfFun-debug.apk

          # A byte-identical APK produces no commit — one of three brakes on
          # the build loop (also: paths-ignore above, and [skip ci] below).
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "Build debug APK from ${GITHUB_SHA:0:7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # A rolling `latest` release, because the GitHub mobile app downloads
      # release assets directly instead of handing binaries off to a browser.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --cleanup-tag also drops the `latest` tag so the next run's
          # `gh release create latest` doesn't fail on a surviving tag.
          # `|| true` lets the very first run succeed with no release yet.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/WheelOfFun-debug.apk \
            --target "$GITHUB_SHA" \
            --title "WheelOfFun — latest debug build" \
            --notes "Built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
